<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tp-HTTP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎬 CinéPass</h1>
        <p>Inscription au Club de Cinéma - Saison 2025</p>
    </div>

    
    <div class="alert-box">
        <span>💡</span>
        <div>Rejoignez notre club et profitez de tarifs réduits, d'avant-premières exclusives et de rencontres avec des réalisateurs !</div>
    </div>

   
    <div class="form-content">
        <div class="section-title">
            <span>👤</span> Informations personnelles
        </div>

        <form>
        
            <div class="form-row">
                <div class="form-group">
                    <label>Prénom :</label>
                    <input type="text" placeholder="Ex: Ahmed">
                </div>
                <div class="form-group">
                    <label>Nom :</label>
                    <input type="text" placeholder="Ex: Bensalem">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group full-width">
                    <label>Adresse email :</label>
                    <input type="email" placeholder="votre.email@exemple.com">
                </div>
            </div>

           
            <div class="form-row">
                <div class="form-group full-width">
                    <label>Mot de passe (compte en ligne) :</label>
                    <input type="password" placeholder="Minimum 8 caractères">
                </div>
            </div>

            
            <div class="form-row">
                <div class="form-group">
                    <label>Téléphone :</label>
                    <input type="tel" placeholder="0555123456">
                </div>
                <div class="form-group">
                      <label>Date de naissance :</label>
                    <input type="text" placeholder="jj/mm/aaaa">
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
